services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stressfreeclaim
      POSTGRES_USER: stressfreeclaim
      POSTGRES_PASSWORD: stressfreeclaim
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stressfreeclaim -d stressfreeclaim"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - stressfreeclaim_postgres:/var/lib/postgresql/data

volumes:
  stressfreeclaim_postgres:
